name: Full-stack CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q backend/tests/test_structure.py
      # The approved model bundle and sample payload are tracked in Git and the
      # runner installs the same pinned scikit-learn, so model-dependent tests run too.
      - run: python -m pytest -q backend/tests/test_api.py
      - run: python backend/test_pipeline.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx ng test --watch=false
      - uses: actions/upload-artifact@v4
        with:
          name: angular-build
          path: frontend/dist/
